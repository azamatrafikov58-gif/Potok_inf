services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: news
      POSTGRES_PASSWORD: news_password
      POSTGRES_DB: newsroom
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news -d newsroom"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    ports:
      - "8090:8090"
    environment:
      # Эта строка автоматически подключает Python к PostgreSQL
      DATABASE_URL: postgresql://news:news_password@db:5432/newsroom
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data:
